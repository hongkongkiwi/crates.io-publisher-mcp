[package]
name = "cratesdotio-mcp"
version = "0.1.0"
edition = "2024"
description = "A Model Context Protocol (MCP) server for searching and retrieving crate information from crates.io"
license = "MIT"
repository = "https://github.com/fedemagnani/crates.io-mcp"
readme = "README.md"
keywords = ["mcp", "crates-io", "tool", "ai", "llm"]
categories = ["development-tools", "api-bindings", "mcp", "ai", "llm"]

[dependencies]
rmcp = { version = "0.12.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
crates_io_api = "0.12"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.2"
clap = { version = "4.5.54", features = ["derive"] }
