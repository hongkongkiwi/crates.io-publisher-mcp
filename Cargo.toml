[package]
name = "cratesdotio-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
# MCP SDK
rmcp = { version = "0.12.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }

# Crates.io API client
crates_io_api = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework for HTTP transport
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON Schema for tool parameters
schemars = "0.8"
