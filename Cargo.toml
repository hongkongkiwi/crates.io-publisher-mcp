[package]
name = "crates-io-publisher-mcp"
version = "0.2.0"
edition = "2024"
description = "A Model Context Protocol (MCP) server for crates.io with optional scaffolding, publishing, yank, owner, and trusted publishing tools"
license = "MIT"
repository = "https://github.com/hongkongkiwi/crates.io-publisher-mcp"
readme = "README.md"
keywords = ["mcp", "crates-io", "tool", "ai", "llm"]
categories = ["development-tools", "api-bindings", "config", "command-line-utilities"]

[[bin]]
name = "cratesdotio-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.12.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
crates_io_api = "0.12"
reqwest = { version = "0.12", features = ["json"] }
toml = "1"
url = "2"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.2"
clap = { version = "4.5.54", features = ["derive", "env"] }
rpassword = "7"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
