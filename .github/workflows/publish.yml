name: Publish

# The crate is named crates-io-publisher-mcp and the binary is cratesdotio-mcp.
#
# Before this workflow can publish, do one manual publish with a scoped token,
# then add a trusted publisher on crates.io for:
#   repository: hongkongkiwi/crates.io-publisher-mcp
#   workflow:   publish.yml
# After that, tagging v* publishes with a short-lived OIDC token. Consider
# setting trustpub_only so long-lived tokens can no longer publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Test
        run: cargo test --locked

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
